<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFACD"/>
      <stop offset="25%" stop-color="#FFD700"/>
      <stop offset="65%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#7A5500"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF5A0"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#7A5500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer arc ring (large arc, clockwise, from bottom-left to upper-right) -->
  <path
    d="M 42 158 A 74 70 0 1 1 158 42"
    stroke="url(#goldMain)"
    stroke-width="17"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Lower tail sweeping out from start of arc -->
  <path
    d="M 42 158 Q 22 176 38 188"
    stroke="url(#goldMain)"
    stroke-width="13"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Arrow at upper-right end of arc -->
  <!-- Arrowhead: tip at ~(168,32), wings going back -->
  <path
    d="M 148 50 L 168 34 L 160 58"
    stroke="url(#goldMain)"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Three ascending bar chart bars -->
  <!-- Left bar (shortest) -->
  <rect x="70" y="120" width="15" height="36" rx="4" fill="url(#goldBar)" filter="url(#glow)"/>
  <!-- Middle bar -->
  <rect x="91" y="102" width="15" height="54" rx="4" fill="url(#goldBar)" filter="url(#glow)"/>
  <!-- Right bar (tallest) -->
  <rect x="112" y="80" width="15" height="76" rx="4" fill="url(#goldBar)" filter="url(#glow)"/>
</svg>
