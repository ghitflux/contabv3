services:
  postgres:
    image: postgres:16
    container_name: ConsultContabil-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contabil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contabil123}
      POSTGRES_DB: ${POSTGRES_DB:-contabil_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - consultcontabil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-contabil} -d $${POSTGRES_DB:-contabil_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - consultcontabil-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: ConsultContabil-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: "${DEBUG:-true}"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-contabil}:${POSTGRES_PASSWORD:-contabil123}@postgres:5432/${POSTGRES_DB:-contabil_db}
      DATABASE_WRITE_URL: postgresql+asyncpg://${POSTGRES_USER:-contabil}:${POSTGRES_PASSWORD:-contabil123}@postgres:5432/${POSTGRES_DB:-contabil_db}
      DATABASE_READ_URL: postgresql+asyncpg://${POSTGRES_USER:-contabil}:${POSTGRES_PASSWORD:-contabil123}@postgres:5432/${POSTGRES_DB:-contabil_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-12345678}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ENABLE_DEV_ADMIN_BOOTSTRAP: ${ENABLE_DEV_ADMIN_BOOTSTRAP:-true}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@contabil.com}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-admin123}
      DEV_ADMIN_NAME: ${DEV_ADMIN_NAME:-Administrador Local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      UPLOAD_DIR: /var/uploads
      OFFICE_CLIENT_ID: ${OFFICE_CLIENT_ID:-522d5b00-2a4d-4f5a-8913-5d4ee0cf8104}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - consultcontabil_api_uploads:/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - consultcontabil-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: ConsultContabil-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-SaaS Contábil}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_OFFICE_CLIENT_ID: ${NEXT_PUBLIC_OFFICE_CLIENT_ID:-522d5b00-2a4d-4f5a-8913-5d4ee0cf8104}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - consultcontabil_root_node_modules:/app/node_modules
      - consultcontabil_web_node_modules:/app/apps/web/node_modules
      - consultcontabil_web_next:/app/apps/web/.next
    depends_on:
      api:
        condition: service_healthy
    networks:
      - consultcontabil-network
    restart: unless-stopped

volumes:
  consultcontabil_postgres_data:
  consultcontabil_api_uploads:
  consultcontabil_root_node_modules:
  consultcontabil_web_node_modules:
  consultcontabil_web_next:

networks:
  consultcontabil-network:
    driver: bridge
